# chaos-core 内置错误码文案（根资源包，英文）。
#
# 放在 chaos-core 而不是 chaos-web：错误码是 Servlet 服务与响应式网关共用的契约，
# 网关不依赖 chaos-web，文案留在 chaos-web 会导致网关错误响应永远只能输出英文兜底串。
# 业务系统在自己的 messages.properties 中定义同名 key 即可覆盖。

chaos.error.common.success=success
chaos.error.common.bad-request=bad request
chaos.error.common.unauthorized=unauthorized
chaos.error.common.forbidden=forbidden
chaos.error.common.not-found=not found
chaos.error.common.method-not-allowed=method not allowed
chaos.error.common.unsupported-media-type=unsupported media type
chaos.error.common.too-many-requests=too many requests
chaos.error.common.idempotent-rejected=duplicate request
chaos.error.common.internal-error=internal server error
chaos.error.common.service-unavailable=service unavailable

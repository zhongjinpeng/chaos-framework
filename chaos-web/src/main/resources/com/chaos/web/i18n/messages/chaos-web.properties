# chaos-web 内置文案（根资源包，英文）。
#
# 错误码文案在 chaos-core 的 chaos-core.properties；这里只放 Servlet Web 层专有提示。
# 带 {0}、{1} 占位符的条目会经过 MessageFormat 处理，其中的单引号需要写成两个。

chaos.web.missing-parameter=Missing required parameter: {0}
chaos.web.missing-header=Missing required request header: {0}
chaos.web.type-mismatch=Parameter {0} has an invalid type, expected {1}
chaos.web.malformed-body=Malformed request body
chaos.web.method-not-supported=Request method not supported: {0}
chaos.web.media-type-not-supported=Content-Type not supported: {0}
chaos.web.missing-idempotency-key=Missing or invalid {0} header
chaos.web.validation-field={0} {1}

# 能力：对象存储（chaos-storage-starter）—— 追加到业务服务配置中
chaos:
  storage:
    provider: minio
    max-object-size: 50MB
    allowed-content-types:
      - image/png
      - image/jpeg
      - application/pdf
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
